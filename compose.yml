services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cat_simulasi_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: linux/amd64
    image: mysql:5.7.44
    container_name: cat_simulasi_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ujian
      MYSQL_USER: catuser
      MYSQL_PASSWORD: catpassword
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - cat_mysql_data:/var/lib/mysql
      - ./ujian.sql:/docker-entrypoint-initdb.d/01-ujian.sql:ro

    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8
      - --collation-server=utf8_unicode_ci

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    platform: linux/amd64
    image: phpmyadmin/phpmyadmin
    container_name: cat_simulasi_phpmyadmin
    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    depends_on:
      db:
        condition: service_healthy

volumes:
  cat_mysql_data:
